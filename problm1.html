<!DOCTYPE html>
<html>
<head>
    <title>Grocery Calculator</title>
</head>
<body>

<h2>Grocery Shop Calculator</h2>
<p>Open the browser console to see the output</p>

<script>
    
    let item1 = "Rice";
    let item2 = "Sugar";
    let item3 = "Wheat";

    let ricePrice = 60;
    let sugarPrice = 40;
    let wheatPrice = 50;


    let riceQty = 2;
    let sugarQty = 3;
    let wheatQty = 1;


    let riceCost = ricePrice * riceQty;
    let sugarCost = sugarPrice * sugarQty;
    let wheatCost = wheatPrice * wheatQty;

    console.log(item1 + " cost: ₹" + riceCost);
    console.log(item2 + " cost: ₹" + sugarCost);
    console.log(item3 + " cost: ₹" + wheatCost);

    let totalBill = riceCost + sugarCost + wheatCost;
    console.log("Total bill: ₹" + totalBill);


    sugarQty = 5;
    sugarCost = sugarPrice * sugarQty;


    let updatedTotalBill = riceCost + sugarCost + wheatCost;
    console.log("Updated total bill: ₹" + updatedTotalBill);
</script>

</body>
</html>
